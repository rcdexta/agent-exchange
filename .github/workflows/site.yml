name: Website checks
on:
  push:
    paths: ['site/**', 'claude.rc/**', 'AGENTS.md', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', 'claude.rc/**', 'AGENTS.md', '.github/workflows/site.yml']
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
